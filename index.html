<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Escala - Igreja Rasgando os Céus Bauru</title>
    <meta name="description" content="Painel de Escala da Igreja Rasgando os Céus Bauru. Gestão de 51 integrantes, disponibilidade mensal e escala justa." />
    <meta property="og:title" content="Painel de Escala - Igreja Rasgando os Céus Bauru" />
    <meta property="og:description" content="Painel de Escala da Igreja Rasgando os Céus Bauru." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/jpeg" href="./logo-igreja.jpg" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-sky-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx" onerror="loadGitHubPagesBundle()"></script>
    <script>
      function loadGitHubPagesBundle() {
        if (!window.__BUNDLE_LOADED__) {
          window.__BUNDLE_LOADED__ = true;
          console.warn('[Hospedagem Estática] Carregando bundle compilado...');
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './assets/app.css';
          document.head.appendChild(link);

          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/app.js';
          document.body.appendChild(s);
        }
      }
      // Se estiver no GitHub Pages (.github.io), carrega o bundle de produção compilado diretamente
      if (window.location.hostname.endsWith('github.io')) {
        loadGitHubPagesBundle();
      }
    </script>
  </body>
</html>
